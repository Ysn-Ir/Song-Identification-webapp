services:
  # ============================================================================
  # 1. Spring Boot + C++ Shazam Audio DSP Engine (Docker Web Service)
  # ============================================================================
  - type: web
    name: shazam-dsp-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter # Starter plan recommended for FFmpeg and audio processing memory
    region: frankfurt # Or oregon / ohio
    healthCheckPath: /api/stats
    envVars:
      - key: PORT
        value: 8080
      - key: SHAZAM_EXECUTABLE_PATH
        value: /app/shazam
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MONGODB_URI
        sync: false # Supply your free MongoDB Atlas connection string in Render Dashboard

  # ============================================================================
  # 2. Shazam React Studio UI (Static Site)
  # ============================================================================
  - type: web
    name: shazam-studio-ui
    runtime: static
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: shazam-dsp-backend
          property: host
